name: backend

on:
  pull_request:
  push:
    branches: [main, dev, backend-dev]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: generate the database client (it is not committed)
        run: npm run db:generate --workspace @smart-home/db
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  integration:
    name: database invariants
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: smart_home
          POSTGRES_USER: smart_home
          POSTGRES_PASSWORD: smart_home
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_home -d smart_home"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      # connection_limit/pool_timeout: Prisma's default pool is numCPUs*2+1 -- 5 on this runner's
      # 2 vCPUs -- and booking-checkout.test.ts's "50 concurrent checkouts for one slot" test opens
      # 50 simultaneous transactions against it. With only 5 connections, most of those queue past
      # Prisma's default 10s pool_timeout and surface as a raw 500 INTERNAL_ERROR instead of ever
      # reaching the exclusion-constraint race the test is actually about (already translated to
      # 409 SLOT_TAKEN in BookingService.create's catch block). Postgres's own default
      # max_connections (100) has room for far more than this.
      DATABASE_URL: postgresql://smart_home:smart_home@localhost:5432/smart_home?schema=public&connection_limit=25&pool_timeout=30
      DIRECT_URL: postgresql://smart_home:smart_home@localhost:5432/smart_home?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-value-with-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-value-with-32-characters
      CSRF_SECRET: ci-csrf-secret-value-with-32-characters
      OTP_PEPPER: ci-otp-pepper-value-with-32-characters
      TOTP_ENCRYPTION_KEY: B1JvdTIta2V5LWZvci1jaS0zMi1ieXRlcy1sb25nISE=
      CNIC_ENCRYPTION_KEY: //79/Pv6+fj39vX08/Lx8O/u7ezr6uno5+bl5OPi4eA=
      MOCK_PAYMENT_WEBHOOK_SECRET: ci-webhook-secret-value
      DEV_INBOX_ENABLED: 'true' # the tests read one-time codes from the dev inbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: assert this job's own env block satisfies the environment schema
        # A mistyped base64 key, or a variable added to environment.schema.ts but
        # forgotten here, fails here naming the offender instead of the whole
        # integration job dying on startup with a less obvious message.
        run: npm run check:ci-env --workspace @smart-home/api
      - name: generate the database client (it is not committed)
        run: npm run db:generate --workspace @smart-home/db
      - name: build the workspace packages (their dist/ is not committed)
        run: npm run build
      - run: npm run db:reset
      - run: npm run test:integration

  migration-fidelity:
    name: the migrations build docs-final/schema.sql
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: smart_home
          POSTGRES_USER: smart_home
          POSTGRES_PASSWORD: smart_home
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_home -d smart_home"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DIRECT_URL: postgresql://smart_home:smart_home@localhost:5432/smart_home?schema=public
    steps:
      - uses: actions/checkout@v4
      - name: install a postgresql client matching the server
        # Installed explicitly rather than trusting the runner image, which ships
        # whichever version Ubuntu happens to carry: a client older than the server
        # refuses to read it, and the check compares two live databases.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          psql --version
      - name: assert the migrations build exactly the canonical schema
        # Builds the schema twice -- once by replaying every migration, once by
        # applying docs-final/schema.sql -- and compares the two resulting catalogues.
        # The previous check compared the doc's text with 0001_init.sql, which could
        # only ever hold while there was a single migration.
        run: npm run db:check-schema --workspace @smart-home/db

  security-scan:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: smart_home
          POSTGRES_USER: smart_home
          POSTGRES_PASSWORD: smart_home
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_home -d smart_home"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://smart_home:smart_home@localhost:5432/smart_home?schema=public
      DIRECT_URL: postgresql://smart_home:smart_home@localhost:5432/smart_home?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-value-with-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-value-with-32-characters
      CSRF_SECRET: ci-csrf-secret-value-with-32-characters
      OTP_PEPPER: ci-otp-pepper-value-with-32-characters
      TOTP_ENCRYPTION_KEY: B1JvdTIta2V5LWZvci1jaS0zMi1ieXRlcy1sb25nISE=
      CNIC_ENCRYPTION_KEY: //79/Pv6+fj39vX08/Lx8O/u7ezr6uno5+bl5OPi4eA=
      MOCK_PAYMENT_WEBHOOK_SECRET: ci-webhook-secret-value
      DEV_INBOX_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace @smart-home/db
      - run: npm run build
      - run: npm run db:reset
      - name: start the API for the scan
        # Left running for the duration of the job. The ZAP container reaches it over the
        # Docker bridge, which is why the port is bound to 0.0.0.0 rather than localhost --
        # an API published only on the loopback interface is invisible to a sibling
        # container, and the scan would silently test nothing.
        run: |
          npm run start --workspace @smart-home/api &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health/live > /dev/null 2>&1; then
              echo "API is up after ${attempt}s"; break
            fi
            sleep 1
          done
          curl -fsS http://localhost:3000/health/live > /dev/null
      - name: baseline scan
        # `continue-on-error` is deliberate and is the weakest part of this job: a ZAP baseline
        # alerts on findings, it does not fail on them. Turning that into a hard gate needs a
        # reviewed baseline file committed to the repo -- accept today's findings as the baseline,
        # fail on anything new -- and that baseline is not written yet. Until it is, this job
        # reports and a human reads it. See PROGRESS_TRACKER SHM-092.
        continue-on-error: true
        # Pinned to the commit SHA of v0.15.0, not to a tag or a branch. Actions resolve only
        # tags, releases and full SHAs, so `@main` fails at "Prepare all required actions" with
        # "unable to find version". The SHA also means the scan cannot change under us: a tag can
        # be moved to a different commit, a SHA cannot.
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        id: zap
        with:
          target: http://localhost:3000
          config_file: .github/zap/zap-baseline.yml
          rules_file: .github/zap/zap-rules.yml
          fail_on_error: false
      - name: fail on HIGH or CRITICAL findings
        # The part that is a real gate. ZAP itself does not fail the build; this does. A high or
        # critical finding is a security regression and should stop the pipeline, while medium and
        # low are reported for triage rather than blocking every PR.
        if: steps.zap.outputs.hi_count != '0' || steps.zap.outputs.climax_count != '0'
        run: |
          echo "::error::ZAP found $([ "${{ steps.zap.outputs.hi_count }}" != '0' ] && echo "${{ steps.zap.outputs.hi_count }} high" || true) $([ "${{ steps.zap.outputs.climax_count }}" != '0' ] && echo "${{ steps.zap.outputs.climax_count }} critical") finding(s)"
          exit 1
      - name: keep the report as an artifact
        # Attached to the run so a failure can be investigated without re-running the scan, which
        # takes minutes and needs a live database.
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: ./
          retention-days: 14
