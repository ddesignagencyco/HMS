# SHM-094 · build and release.
#
# A tag that looks like a version ships: images are built once and pushed to GHCR, then the
# staging host is rolled automatically (zero manual steps — the acceptance criterion), and
# production is rolled only after a human approves the `production` environment.
#
# Delivery model: the deployment host holds the stack and its `.env`; this workflow ssh's in
# and runs `docker compose pull / migrate / up`. Migrations are applied from the host's own
# `migrate` image, so database credentials never leave the host and the schema is always the
# one that matches the images being rolled.
#
# Required repository configuration (Settings → Secrets and variables → Actions):
#   secrets  STAGING_SSH_KEY, STAGING_HOST, STAGING_USER, STAGING_SSH_KNOWN_HOSTS
#   secrets  PRODUCTION_SSH_KEY, PRODUCTION_HOST, PRODUCTION_USER, PRODUCTION_SSH_KNOWN_HOSTS
#   env      `staging` and `production` environments; add required reviewers to `production`
#            (that review is the manual approval gate).
# GITHUB_TOKEN alone pushes and pulls the images — no registry secret to manage.

name: deploy

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_registry: ${{ steps.image.outputs.registry }}
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: derive the GHCR path and tag
        id: image
        # GHCR requires a lowercase repository name; the tag is the version tag on a tag
        # push, or the commit sha on a manual run.
        run: |
          echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: build and push api, worker and migrate images
        env:
          IMAGE_REGISTRY: ${{ steps.image.outputs.registry }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          for target in api worker migrate; do
            echo "::group::building $target"
            docker buildx build \
              --target "$target" \
              --tag "${IMAGE_REGISTRY}/${target}:${IMAGE_TAG}" \
              --tag "${IMAGE_REGISTRY}/${target}:sha-${GITHUB_SHA::12}" \
              --push \
              .
            echo "::endgroup::"
          done

  staging:
    name: migrate and deploy to staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      IMAGE_REGISTRY: ${{ needs.build.outputs.image_registry }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH || '/srv/smart-home' }}
    steps:
      - name: roll the staging stack
        # The token is piped to the remote `docker login` over stdin, so it never appears in
        # the process list or the workflow log.
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          SSH_USER: ${{ secrets.STAGING_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          ROLL="cd '${DEPLOY_PATH}' && \
            IMAGE_REGISTRY='${IMAGE_REGISTRY}' IMAGE_TAG='${IMAGE_TAG}' docker compose -f infra/docker-compose.prod.yml --env-file .env pull && \
            IMAGE_REGISTRY='${IMAGE_REGISTRY}' IMAGE_TAG='${IMAGE_TAG}' docker compose -f infra/docker-compose.prod.yml --env-file .env --profile migrate run --rm migrate && \
            IMAGE_REGISTRY='${IMAGE_REGISTRY}' IMAGE_TAG='${IMAGE_TAG}' docker compose -f infra/docker-compose.prod.yml --env-file .env up -d --remove-orphans"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin && $ROLL"

  production:
    name: migrate and deploy to production
    needs: [build, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A required reviewer on this environment is the manual approval before prod changes.
    environment: production
    env:
      IMAGE_REGISTRY: ${{ needs.build.outputs.image_registry }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH || '/srv/smart-home' }}
    steps:
      - name: roll the production stack
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          ROLL="cd '${DEPLOY_PATH}' && \
            IMAGE_REGISTRY='${IMAGE_REGISTRY}' IMAGE_TAG='${IMAGE_TAG}' docker compose -f infra/docker-compose.prod.yml --env-file .env pull && \
            IMAGE_REGISTRY='${IMAGE_REGISTRY}' IMAGE_TAG='${IMAGE_TAG}' docker compose -f infra/docker-compose.prod.yml --env-file .env --profile migrate run --rm migrate && \
            IMAGE_REGISTRY='${IMAGE_REGISTRY}' IMAGE_TAG='${IMAGE_TAG}' docker compose -f infra/docker-compose.prod.yml --env-file .env up -d --remove-orphans"
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "docker login ghcr.io -u '${{ github.actor }}' --password-stdin && $ROLL"
