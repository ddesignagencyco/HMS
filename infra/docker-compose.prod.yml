# SHM-094 · production stack.
#
# The images are built and pushed by .github/workflows/deploy.yml, then a deployment host
# runs `docker compose -f infra/docker-compose.prod.yml --env-file .env pull && up -d`
# against this file. Every value that is a secret or deployment-specific is required from
# the environment (`${VAR:?}` fails fast rather than booting half-configured); the app
# itself validates the rest at startup via environment.schema.ts.
#
# Object storage and SMTP are still the in-process mocks (SHM-011): the schema refuses a
# non-mock STORAGE_PROVIDER/EMAIL_PROVIDER, so there is deliberately no MinIO or Mailpit
# here — deploying them would imply a real adapter that does not exist yet.

name: smart-home-prod

x-app-environment: &app-environment
  NODE_ENV: production
  DIRECT_URL: postgresql://smart_home:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgis:5432/smart_home
  DATABASE_URL: postgresql://smart_home:${POSTGRES_PASSWORD}@postgis:5432/smart_home?schema=public&connection_limit=${DB_CONNECTION_LIMIT:-10}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
  CSRF_SECRET: ${CSRF_SECRET:?set CSRF_SECRET}
  OTP_PEPPER: ${OTP_PEPPER:?set OTP_PEPPER}
  TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY}
  CNIC_ENCRYPTION_KEY: ${CNIC_ENCRYPTION_KEY:?set CNIC_ENCRYPTION_KEY}
  MOCK_PAYMENT_WEBHOOK_SECRET: ${MOCK_PAYMENT_WEBHOOK_SECRET:?set MOCK_PAYMENT_WEBHOOK_SECRET}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_MIN_LEVEL: ${SENTRY_MIN_LEVEL:-error}
  # The provider ports are mock-only by construction today (OQ-03 / OQ-04). Pinned here so
  # a stray value in the host .env fails loudly instead of silently at boot.
  PAYMENT_PROVIDER: mock
  SMS_PROVIDER: mock
  EMAIL_PROVIDER: mock
  MAPS_PROVIDER: mock
  TELEPHONY_PROVIDER: mock
  WHATSAPP_PROVIDER: mock
  STORAGE_PROVIDER: mock

services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_home
      POSTGRES_USER: smart_home
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smart_home -d smart_home']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `$$` escapes compose interpolation, so the password is read from the container's own
    # environment at runtime and never baked into the healthcheck string.
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 3s
      timeout: 3s
      retries: 20

  # Release step. Not started by a plain `up` — run it explicitly with
  # `docker compose --profile migrate run --rm migrate` (or let deploy.yml run the
  # migrations from the runner before this stack is rolled).
  migrate:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/migrate:${IMAGE_TAG:-latest}
    profiles: ['migrate']
    restart: 'no'
    environment:
      DIRECT_URL: postgresql://smart_home:${POSTGRES_PASSWORD}@postgis:5432/smart_home
      DATABASE_URL: postgresql://smart_home:${POSTGRES_PASSWORD}@postgis:5432/smart_home?schema=public
    depends_on:
      postgis:
        condition: service_healthy

  api:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-environment
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *app-environment
      WORKER_METRICS_PORT: '9464'
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The worker's own Prometheus endpoint doubles as its liveness signal: if the job
      # registry is not being served, the worker is not doing its job.
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:9464/metrics').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '${PROMETHEUS_HOST_PORT:-9090}:9090'
    depends_on:
      - api
      - worker

volumes:
  postgis-data:
  redis-data:
  prometheus-data:
