# Prometheus configuration for the production compose stack.
#
# This is the in-compose counterpart to ops/prometheus/prometheus.yml (which targets a
# bare-metal `localhost`). Here the targets are compose service names, and the alert rules
# are bind-mounted from ops/prometheus/alerts.yml so there is one copy of the rules.
#
# Two scrape jobs on purpose: the HTTP and gauge metrics are served by the API on :3000,
# but the background jobs that shm_jobs_total counts run in the worker on :9464. Scraping
# only the API leaves the job metrics empty.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: smart-home-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']

  - job_name: smart-home-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:9464']
