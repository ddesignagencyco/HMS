name: smart-home-infra

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: smart-home-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_home
      POSTGRES_USER: smart_home
      POSTGRES_PASSWORD: smart_home
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smart_home -d smart_home']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgis-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smart-home-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

volumes:
  postgis-data:
  redis-data:
